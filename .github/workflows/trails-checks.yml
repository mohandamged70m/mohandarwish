name: Trails checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Lint Trails
        run: >-
          npx eslint lib/analytics lib/trails-notification.ts
          components/dashboard/TrailsTracker.tsx components/dashboard/TrailsHealth.tsx
          components/dashboard/D-Trails.tsx components/cv/CvModal.tsx
          'app/mohanddarwish/[code]/landing.tsx' app/api/track
          app/api/dashboard/trails-health app/api/dashboard/trails-outbox
          tests/trails-*.test.ts
      - run: npm run build
