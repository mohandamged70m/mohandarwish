# Verify the portfolio without production secrets.
# Production deploys happen on Vercel (auto-deploy from main with project
# env vars) — NOT via GitHub Pages, which can't serve API routes, the
# proxy, or any Convex-backed feature this app needs.
name: Verify

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Test-only placeholders (public, not secrets): let the Auth.js code
      # paths run without throwing during build and browser checks. Real
      # credentials live in Vercel and .env.local, never here.
      AUTH_SECRET: ci-test-placeholder-not-a-secret-use-npx-auth-secret
      AUTH_GOOGLE_ID: ci-test-google-client-id
      AUTH_GOOGLE_SECRET: ci-test-google-client-secret
      DASHBOARD_OWNER_EMAIL: owner@example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Next.js types
        # .next/ is gitignored: next-env.d.ts references its generated route
        # types, so create them before typechecking a fresh checkout.
        run: npx --no-install next typegen
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Security and route tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser checks
        run: npm run test:e2e
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: test-results/
